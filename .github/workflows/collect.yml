name: Collecte carnet BRVM

on:
  workflow_dispatch:
    inputs:
      part:
        description: "1 = matin, 2 = après-midi"
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]

concurrency:
  group: brvm-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lcisse031/brvm-orderbook
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fenêtre de collecte
        env:
          PART: ${{ inputs.part }}
        run: |
          echo "PART=$PART" >> "$GITHUB_ENV"
          if [ "$PART" = "2" ]; then
            echo "SESSION_START_UTC=12:00" >> "$GITHUB_ENV"
            echo "SESSION_END_UTC=15:45" >> "$GITHUB_ENV"
          else
            echo "SESSION_START_UTC=08:45" >> "$GITHUB_ENV"
            echo "SESSION_END_UTC=12:30" >> "$GITHUB_ENV"
          fi

      - name: Collecte
        run: python collector.py
        env:
          ONE_SHOT: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: ${{ vars.USER_AGENT || 'brvm-orderbook-research/1.0' }}
