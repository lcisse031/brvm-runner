name: Hub BRVM
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs séparés par des espaces"
        required: true
        default: "boc obligations intraday"
      purger:
        description: "Purger le carnet > 28 j"
        type: boolean
        default: false
concurrency:
  group: brvm-hub
  cancel-in-progress: false
jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lcisse031/brvm-hub
          token: ${{ secrets.HUB_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collecte
        env:
          HUB_DB_URL: ${{ secrets.HUB_DB_URL }}
          ORDERBOOK_DB_URL: ${{ secrets.ORDERBOOK_DB_URL }}
          JOBS: ${{ inputs.jobs }}
          PURGER: ${{ inputs.purger }}
        run: |
          ARGS="--jobs $JOBS"
          [ "$PURGER" = "true" ] && ARGS="$ARGS --purger"
          python run.py $ARGS
